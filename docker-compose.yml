services:
  db:
    image: postgres:18
    restart: always
    shm_size: 1gb
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - bb_data:/var/lib/postgresql/18/docker

volumes:
  bb_data:
