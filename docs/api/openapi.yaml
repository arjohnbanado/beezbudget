  /api/v1/auth/reset-password:
    post:
      operationId: AuthController_resetPassword_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
                  allOf:
                    - type: string
                      pattern: '[a-z]'
                    - type: string
                      pattern: '[A-Z]'
                    - type: string
                      pattern: '[0-9]'
                    - type: string
                      pattern: '[^a-zA-Z0-9]'
                rawToken:
                  type: string
                  pattern: ^[0-9a-f]{64}$
              required:
                - password
                - rawToken
      responses:
        '201':
          description: Password reset successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                required:
                  - id
                additionalProperties: false
        '400':
          description: The request failed validation.
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                  - detail
                  - instance
                  - code
                  - timestamp
